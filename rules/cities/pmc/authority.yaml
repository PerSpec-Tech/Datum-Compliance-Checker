# Planning authority definition.
id: pmc
name: Pune Municipal Corporation
state: Maharashtra
# Reverse-geocode matches: any of these in the Nominatim address → this authority.
match:
  city: [Pune, Pune City, पुणे]
  state: [Maharashtra]
  exclude_city: [Pimpri-Chinchwad, Pimpri Chinchwad,   # PCMC: separate authority, not covered yet
                 Khadki, Pune Cantonment, Dehu Road]   # cantonment boards: their own planning authorities
  # Villages merged into PMC (e.g. Kondhwa Budruk) have no 'city' in OpenStreetMap, only the
  # subdistrict; inside it, anything not excluded above is PMC.
  county: [Pune City Subdistrict]
rulesets: [nbc2016, udcpr2020, pmc]                    # later overrides earlier
sources: [udcpr2020, nbc2016, mfa2006, nbcs2026]       # manifest doc ids
# Domains given to Tavily as include_domains. Government and official sources only.
tavily_domains:
  - pmc.gov.in
  - pmrda.gov.in
  - urban.maharashtra.gov.in
  - lj.maharashtra.gov.in
  - punemetrorail.org
  - mahafireservice.gov.in
# Offline fallback only (used if the address lookup fails): a rough box around PMC limits.
# It also covers some PCMC/PMRDA land, so results from it are marked as approximate.
bbox: { south: 18.42, north: 18.64, west: 73.74, east: 73.98 }
