id: pmc.tod.small-tenement-share
title: At least half the residential FSI in tenements of 60 sq.m or less
authority: pmc
clause:
  ref: 14.2.1.3
  excerpt: Out of total proposed tenements, the tenements equivalent to at least 50% of total FSI shall
    be of a size equal to or less than 60 sq.m. carpet area except the projects in which rehabilitation
    of existing tenements is undertaken.
  source: udcpr2020 p.268
  retrieved: '2026-10-19'
status: draft
severity: major
kind: check
applies_when: project.overlays.metro_tod and project.building_type != 'bungalow_self_use'
limit: '0.5'
measured: derived.small_unit_carpet_share
check: measured >= limit
message: '{measured:.0%} of residential carpet area is in tenements of 60 sq.m or less; at least {limit:.0%}
  is required (approximated by carpet area).'
compiled_by: agent:claude-opus-5-5@p2.6-batch1
freshness:
  status: unchecked
  url: null
  checked: null
