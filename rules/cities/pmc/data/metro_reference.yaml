# Pune Metro reference list, transcribed by hand from sources/pmc/Metro station list.png (captured 2026-10-11)
# from https://www.punemetrorail.org/route-map.aspx
# Used only to cross-check OSM station data (scripts/fetch_metro_stations.py). Names are as printed in the screenshot.
# Status values: operational | under_construction | proposed

lines:
  - { id: "1",  name: "PCMC – Swargate",                 status: operational }
  - { id: "2",  name: "Vanaz – Ramwadi",                 status: operational }
  - { id: "1A", name: "PCMC – Bhakti Shakti",            status: under_construction }
  - { id: "1B", name: "Swargate – Katraj",               status: under_construction }
  - { id: "2A", name: "Vanaz – Chandani Chowk",          status: under_construction }
  - { id: "2B", name: "Ramwadi – Wagholi/Vitthalwadi",   status: under_construction }
  - { id: "3",  name: "Maan – Hinjawadi – Shivajinagar (PMRDA)", status: unknown }   # no status shown in the legend; confirm
  - { id: "4",  name: "Khadakwasla – Kharadi",           status: under_construction }
  - { id: "4A", name: "Nal Stop – Warje – Manik Baug",   status: under_construction }
  - { id: "4B", name: "Hadapsar – Loni Kalbhor",         status: proposed }
  - { id: "4C", name: "Hadapsar – Saswad Road",          status: proposed }

