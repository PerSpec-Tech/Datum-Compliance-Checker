id: udcpr2020.ch9.exit-door-height
title: Minimum exit door height
authority: udcpr2020
clause:
  ref: 9.29.1 (ii)
  excerpt: No exit doorway shall be less than 90 cm. in width except assembly buildings where door width
    shall be not less than 200 cm. Doorway shall be not less than 200 cm. in height.
  source: udcpr2020 p.165
  retrieved: '2026-10-19'
status: draft
severity: major
kind: check
for_each: doors
applies_when: item.is_exit
limit: '2.0'
measured: item.height_m
check: measured >= limit
message: Exit door is {measured:.2f} m high; minimum is {limit:.2f} m.
fix_unit: m
