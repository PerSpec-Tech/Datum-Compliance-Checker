id: udcpr2020.ch9.stair-width-residential
title: Minimum staircase width (residential)
authority: udcpr2020
clause:
  ref: Table No. 9-G (Regulation 9.28.8)
  excerpt: 'The minimum width of staircases / corridors for various buildings shall be as below. Residential
    Buildings: a) Individual Housing upto G + 2 storeys 0.75; b) Multi-storied Residential Building upto
    15 m. height 1.00; c) above 15 m. & upto 24 m. height 1.20; d) above 24 m. height 1.50.'
  source: udcpr2020 p.165
  retrieved: '2026-10-19'
status: draft
severity: critical
kind: check
for_each: stairs
applies_when: project.occupancy.group == 'A'
limit: 0.75 if (project.building_type == 'bungalow_self_use' or project.occupancy.subdivision == 'A-2')
  and derived.floors_above_ground <= 3 else (1.0 if derived.building_height_m <= 15 else (1.2 if derived.building_height_m
  <= 24 else 1.5))
measured: item.min_run_width_m
check: measured >= limit
message: Stair is {measured:.2f} m wide; minimum is {limit:.2f} m.
fix_unit: m
compiled_by: agent:claude-opus-5-5@p2.6-batch1
freshness:
  status: unchecked
  url: null
  checked: null
