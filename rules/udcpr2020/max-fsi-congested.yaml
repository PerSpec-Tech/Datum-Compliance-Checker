id: udcpr2020.ch6.max-fsi-congested
title: Maximum building potential (FSI) — congested area
authority: udcpr2020
clause:
  ref: Table No. 6-A (Regulation 6.1.1)
  excerpt: The maximum permissible basic floor space index, FSI on payment of premium, permissible TDR
    loading shall be as per the following Table No.6-A.
  source: udcpr2020 p.105
  retrieved: '2026-10-19'
status: draft
severity: critical
kind: check
applies_when: project.congested_area == True and project.occupancy.group == 'A' and (project.overlays.metro_tod
  == False or derived.front_road_width_m < 9)
limit: table('udcpr2020.max_fsi_6a_mc', derived.front_road_width_m)
measured: derived.far
check: measured <= limit
message: FSI is {measured:.2f}; the maximum building potential for this road width is {limit:.2f} (excluding
  ancillary area FSI).
metric: fsi_max
fix_unit: FSI
compiled_by: agent:claude-opus-5-5@p2.6-batch2
freshness:
  status: unchecked
  url: null
  checked: null
