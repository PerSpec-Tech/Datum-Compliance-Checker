# Local:  docker compose -f deploy/docker-compose.yml up --build   → http://localhost:8000
# Server: set DOMAIN=checker.example.org in the environment, then Caddy serves HTTPS on 443.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env            # NEBIUS_API_KEY, TAVILY_API_KEY (never baked into the image)
    environment:
      APP_DB_PATH: /data/app.sqlite
    volumes:
      - appdata:/data            # SQLite + uploaded IFCs survive restarts
    ports:
      - "8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  appdata:
  caddy_data:
  caddy_config:
